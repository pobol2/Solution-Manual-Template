# Builds the starter and showcase with each project's latexmkrc, uploads
# both PDFs and checks class versions and the committed COMPLETION.md.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run class regression tests
        uses: xu-cheng/texlive-action@v3
        with:
          # l3build uses diff -c; Alpine's BusyBox diff lacks this option.
          os: debian
          texlive_version: 2026
          run: l3build check
      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-diagnostics
          path: build/l3build/test/
          if-no-files-found: ignore

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check class versions against the changelog
        run: python3 .github/scripts/release.py check

  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: starter
            directory: .
          - project: showcase
            directory: examples/showcase
    steps:
      - uses: actions/checkout@v7

      # Remove the committed previews so the manual, figures and report are
      # all generated from source.
      - name: Remove generated files
        working-directory: ${{ matrix.directory }}
        run: |
          rm -rf build
          rm -f main.pdf COMPLETION.md Figures/*.pdf

      # TeX Live image with pdfLaTeX, LuaLaTeX, latexmk and Perl. latexmk runs
      # from each project directory, so it reads that project's latexmkrc
      # (and through it solution-manual/latexmkrc), which also copies main.pdf
      # and COMPLETION.md to the project directory.
      - uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: main.tex
          working_directory: ${{ matrix.directory }}
          # No -halt-on-error: missing Figures/*.pdf must not stop pdfLaTeX before latexmk builds them all
          args: -file-line-error -interaction=nonstopmode

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}.pdf
          path: ${{ matrix.directory }}/main.pdf
          if-no-files-found: error

      # Projects can turn off completion tracking without failing the build.
      - uses: actions/upload-artifact@v7
        if: matrix.project == 'starter'
        with:
          name: completion-report
          path: COMPLETION.md
          if-no-files-found: ignore

  report:
    needs: build
    # Projects created from this template can enable the check by replacing
    # the repository below with their own owner/name, or removing this if.
    if: github.repository == 'pobol2/Solution-Manual-Template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: completion-report
          path: generated-report

      # main.pdf changes on every build (dates, IDs), so only the report is
      # compared with the committed version.
      - name: Check that COMPLETION.md is up to date
        run: diff -u COMPLETION.md generated-report/COMPLETION.md
