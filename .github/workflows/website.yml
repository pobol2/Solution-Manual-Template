# Builds the manual with latexmk and its website with
# solution-manual/site/build.py, and deploys the website to GitHub Pages on
# each push to the default branch. Pull requests and other branches are built
# and checked, not deployed (docs/website.md).
#
# Opt-in: nothing runs until the repository variable SOLUTION_MANUAL_WEBSITE
# is 'true', so a repository created with "Use this template" gets no failing
# run. To enable it: Settings > Pages > Build and deployment > Source: GitHub
# Actions, then Settings > Secrets and variables > Actions > Variables >
# New repository variable: SOLUTION_MANUAL_WEBSITE = true.
#
# In pobol2/Solution-Manual-Template, the website is that of the showcase
# (examples/showcase, with its editions); in any other repository, that of the
# project at the root, set up in site/site.toml.
name: Website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the running one
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: ${{ github.repository == 'pobol2/Solution-Manual-Template' && 'examples/showcase' || '.' }}
  DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    if: vars.SOLUTION_MANUAL_WEBSITE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # configure-pages reads the site URL
    steps:
      - uses: actions/checkout@v7

      # Figures/*.pdf (LuaLaTeX, slow) from an earlier run with the same
      # figure sources, theme and framework
      - name: Restore the figures
        id: figures
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROJECT }}/Figures/*.pdf
          key: >-
            figures-${{ env.PROJECT }}-${{ hashFiles(
            format('{0}/Figures/**', env.PROJECT), format('!{0}/Figures/*.pdf', env.PROJECT),
            format('{0}/myfigures.sty', env.PROJECT), format('{0}/mytheme.sty', env.PROJECT),
            format('{0}/*.lua', env.PROJECT),
            'solution-manual/SolutionFigure.cls', 'solution-manual/*.def') }}

      # Without build/main.fdb_latexmk, latexmk rebuilds a figure older than
      # its source, and the checkout is newer than the restored PDFs
      - name: Mark the restored figures as up to date
        if: steps.figures.outputs.cache-hit == 'true'
        run: touch "$PROJECT"/Figures/*.pdf

      # TeX Live image with pdfLaTeX, LuaLaTeX, latexmk and Perl. latexmk runs
      # from the project, with its latexmkrc: it builds the figures, the
      # manual and its editions, and writes build/main-problems.json.
      - name: Build the manual
        uses: xu-cheng/latex-action@4.1.0
        with:
          root_file: main.tex
          working_directory: ${{ env.PROJECT }}
          # No -halt-on-error: missing Figures/*.pdf must not stop pdfLaTeX before latexmk builds them all
          args: -file-line-error -interaction=nonstopmode

      # Saved right away, so a failed website build does not lose the figures
      - name: Save the figures
        if: >-
          steps.figures.outputs.cache-hit != 'true'
          && hashFiles(format('{0}/Figures/*.pdf', env.PROJECT)) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROJECT }}/Figures/*.pdf
          key: ${{ steps.figures.outputs.cache-primary-key }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: solution-manual/site/requirements.txt

      - run: python -m pip install -r solution-manual/site/requirements.txt

      - id: pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@v5

      # From the project folder, which has site/site.toml. Fails, and deploys
      # nothing, when a check of the website fails. Without deployment, the
      # base URL is that of site.toml.
      - name: Build the website
        working-directory: ${{ env.PROJECT }}
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          python "$GITHUB_WORKSPACE/solution-manual/site/build.py"
          --out "$GITHUB_WORKSPACE/_site" --base-url "$BASE_URL"

      - if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: >-
      vars.SOLUTION_MANUAL_WEBSITE == 'true' && github.event_name != 'pull_request'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
